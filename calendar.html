<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 40px 20px;
    font-family: Verdana, sans-serif;
    background: #f5f7f8;
  }

  .calendar {
    width: 100%;
    max-width: 650px;
    margin: auto;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
  }

  .month {
    padding: 18px 20px;
    background: #085cda;
    color: white;
    text-align: center;
  }

  .month ul {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .month li {
    color: white;
    font-size: 20px;
    text-transform: uppercase;
    letter-spacing: 3px;
  }

  .month .prev,
  .month .next {
    cursor: pointer;
    font-size: 25px;
    line-height: 20px;
  }

  .month .prev {
    float: left;
  }

  .month .next {
    float: right;
  }

  .month .prev:hover,
  .month .next:hover {
    opacity: 0.7;
  }

  #year, #month {
    font-size: 18px;
    font-family: lucida calligraphy;
    letter-spacing: 1px;
  }

  .weekdays {
    margin: 0;
    padding: 12px 0;
    font-family: lucida calligraphy;
    background: #ddd;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    list-style: none;
  }

  .weekdays li {
    color: #555;
    text-align: center;
    font-weight: bold;
    font-size: 13px;
  }

  .days {
    margin: 0;
    padding: 10px;
    background: #eee;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    list-style: none;
  }

  .days li {
    min-height: 55px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 14px;
    color: #555;
    background: white;
    border-radius: 5px;
  }

  .days li:not(.empty) {
    cursor: pointer;
    transition: 0.2s;
  }

  .days li:not(.empty):hover {
    background: #75a5ec;
  }

  .days li.selected {
    background: #085cda;
    color: white;
    font-weight: bold;
  }

  .days li.empty {
    background: transparent;
    cursor: default;
  }

  .days li.today {
    border: 2px solid #085cda;
    color: white;
    background: #085cda;
    font-weight: bold;
  }

  @media screen and (max-width: 500px) {
    body {
      padding: 15px 8px;
    }

    .month li {
      font-size: 16px;
    }

    .month .prev,
    .month .next {
      font-size: 20px;
    }

    .weekdays li {
      font-size: 11px;
    }

    .days {
      padding: 5px;
      gap: 3px;
    }

    .days li {
      min-height: 42px;
      font-size: 12px;
    }
  }
</style>
</head>

<body>

<div class="calendar">
  <div class="month">
    <ul>
      <li class="prev" onclick="changeMonth(-1)">&#10094;</li>
      <li class="next" onclick="changeMonth(1)">&#10095;</li>

      <li>
        <span id="month"></span>
        <span id="year"></span>
      </li>
    </ul>
  </div>

  <ul class="weekdays">
    <li>Mo</li>
    <li>Tu</li>
    <li>We</li>
    <li>Th</li>
    <li>Fr</li>
    <li>Sa</li>
    <li>Su</li>
  </ul>

  <ul class="days" id="days"></ul>
</div>

<script>
  const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  let currentDate = new Date();
  let selectedDate = null;

  function createCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("month").textContent = monthNames[month];
    document.getElementById("year").textContent = year;

    const daysContainer = document.getElementById("days");

    daysContainer.innerHTML = "";

    let firstDay = new Date(year, month, 1).getDay();

    firstDay = firstDay === 0 ? 6 : firstDay - 1;

    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      const emptyDay = document.createElement("li");

      emptyDay.classList.add("empty");
      daysContainer.appendChild(emptyDay);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dayElement = document.createElement("li");
      dayElement.textContent = day;
      const today = new Date();

      if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
        dayElement.classList.add("today");
      }

      if (selectedDate && day === selectedDate.day && month === selectedDate.month && year === selectedDate.year) {
        dayElement.classList.add("selected");
      }

      dayElement.addEventListener("click", function() {
        selectedDate = {day: day, month: month, year: year};
        createCalendar();
      });

      daysContainer.appendChild(dayElement);
    }
  }

  function changeMonth(amount) {
    currentDate.setMonth(currentDate.getMonth() + amount);
    createCalendar();
  }

  createCalendar();
</script>

</body>
</html>
